[project]
name = "aks-ocr-engine"
version = "0.1.0"
description = "Self-hosted Python OCR worker for Aks (English & Devanagari recognition)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [


    
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    "pypdfium2==5.14.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "psutil==7.2.2",
    "pillow==13.0.0",
    "reportlab==5.1.0",
    "scipy==1.18.1",
    "rapidfuzz==3.14.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

