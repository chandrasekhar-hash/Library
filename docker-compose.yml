version: '3.8'

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:16-alpine
    container_name: aks-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aks_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aks_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aks-network

  # 2. Python OCR Microservice
  ocr-engine:
    build:
      context: ./ocr-engine
      dockerfile: Dockerfile
    container_name: aks-ocr-engine
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 5060
    ports:
      - "5060:5060"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5060/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aks-network

  # 3. Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aks-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-aks_db}?schema=public
      OCR_ENGINE_URL: http://ocr-engine:5060
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      SESSION_SECRET: ${SESSION_SECRET:-aks_production_session_secret_change_me_in_production_123456}
      TRUST_PROXY: "true"
    ports:
      - "5050:5050"
    volumes:
      - pdf_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
      ocr-engine:
        condition: service_healthy
    networks:
      - aks-network

  # 4. Frontend Web UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aks-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aks-network

networks:
  aks-network:
    name: aks-network

volumes:
  postgres_data:
    name: aks-postgres-data
  pdf_storage:
    name: aks-pdf-storage
